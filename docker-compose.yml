services:
  analytics-db:
    image: postgres:17
    container_name: ai-trading-analytics-db

    environment:
      POSTGRES_DB: trading_analytics
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_password

    ports:
      - "55432:5432"

    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data

volumes:
  analytics_postgres_data: